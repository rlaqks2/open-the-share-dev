name: 1-Hour Auto Sync Blog Posts & Deploy

# 블로그 새 글 → Supabase 콘텐츠 DB(portfolio_items / press_releases) → 사이트 재배포
# 그리고 사람이 Supabase Table Editor 에서 고친 내용도 이 워크플로가 다음 실행 때 배포한다.
#   (DB 내용 해시를 운영 사이트의 /content-version.txt 와 비교해 "달라졌을 때만" 빌드·배포)
#
# 필요한 설정 (운영 저장소 Settings → Secrets and variables → Actions)
#   Secrets  : CONTENT_INGEST_TOKEN  (블로그 봇 → DB 쓰기 토큰, docs/harness/DATA_GUIDE.md)
#   Variables: VITE_GA_MEASUREMENT_ID / VITE_ANALYTICS_COLLECT_URL / VITE_GOOGLE_SHEET_WEBHOOK_URL (deploy.yml 과 동일)

on:
  schedule:
    # 매 1시간마다 실행 (UTC 기준 매 시간 0분). GitHub 사정으로 몇 시간씩 늦어질 수 있음
    - cron: '0 * * * *'
  # GitHub 웹 브라우저에서 언제든 'Run workflow' 버튼으로 즉시 수동 실행도 가능
  workflow_dispatch:

# gh-pages 브랜치에 push 하는 방식이라 contents: write 만 필요 (pages/id-token 은 Pages Actions 배포용이라 불필요)
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    # 운영 저장소에서만 실행 (테스트 저장소 open-the-share-dev 에서는 자동 커밋·배포하지 않음)
    if: github.repository == 'rlaqks2/open-the-share-website'
    runs-on: ubuntu-latest
    env:
      CONTENT_INGEST_TOKEN: ${{ secrets.CONTENT_INGEST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          # pillow: 블로그 썸네일 리사이즈/압축용 (sync_blog.py)
          pip install pillow

      # 1단계: 새 글 탐지 + 썸네일 저장 + DB 에 넣을 내용을 .sync-pending.json 에 기록 (DB 는 아직 안 씀)
      - name: Stage new blog posts
        run: python scripts/sync_blog.py --stage

      # 2단계: 썸네일을 먼저 master 에 올린다 (이미지 파일만 커밋 → 코드·데이터 충돌 없음)
      #        DB 행보다 이미지가 먼저 있어야 '깨진 썸네일'이 노출되지 않는다.
      - name: Push new thumbnails
        run: |
          if [ -n "$(git status --porcelain public/images/portfolio/)" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add public/images/portfolio/
            git commit -m "chore(auto-sync): add portfolio thumbnails from blog [skip ci]"
            git pull --rebase origin master
            git push origin master
          else
            echo "No new thumbnails."
          fi

      # 3단계: DB 반영 (이미 있는 글은 건너뜀 → 사람이 고친 값·숨긴 글을 덮어쓰지 않음)
      - name: Ingest staged posts into Supabase
        run: python scripts/sync_blog.py --ingest-pending

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 4단계: DB 내용이 운영 사이트와 다를 때만 빌드·배포
      - name: Check content version
        id: check_changes
        run: |
          node scripts/pull-content.mjs
          NEW_VERSION="$(cat public/content-version.txt)"
          LIVE_VERSION="$(curl -fsS --max-time 15 "https://openthe.kr/content-version.txt?t=$(date +%s)" || echo none)"
          echo "DB: $NEW_VERSION / live: $LIVE_VERSION"
          if [ "$NEW_VERSION" != "$LIVE_VERSION" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Content unchanged. Skipping build and deploy."
          fi

      - name: Install dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Build project
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build
        env:
          VITE_GOOGLE_SHEET_WEBHOOK_URL: ${{ vars.VITE_GOOGLE_SHEET_WEBHOOK_URL }}
          # ⚠️ deploy.yml 과 같은 변수 목록을 유지해야 블로그 동기화 배포 때 측정 코드가 빠지지 않습니다.
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_ANALYTICS_COLLECT_URL: ${{ vars.VITE_ANALYTICS_COLLECT_URL }}

      # 빌드가 실패하면 여기까지 오지 않으므로 운영 사이트는 이전 배포 그대로 유지된다.
      - name: Deploy to GitHub Pages (gh-pages)
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: openthe.kr
