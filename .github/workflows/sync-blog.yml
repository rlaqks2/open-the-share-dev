name: 1-Hour Auto Sync Blog Posts & Deploy

on:
  schedule:
    # 매 1시간마다 실행 (UTC 기준 매 시간 0분)
    - cron: '0 * * * *'
  # GitHub 웹 브라우저에서 언제든 'Run workflow' 버튼으로 즉시 수동 실행도 가능
  workflow_dispatch:

# gh-pages 브랜치에 push 하는 방식이라 contents: write 만 필요 (pages/id-token 은 Pages Actions 배포용이라 불필요)
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    # 운영 저장소에서만 실행 (테스트 저장소 open-the-share-dev 에서는 자동 커밋·배포하지 않음)
    if: github.repository == 'rlaqks2/open-the-share-website'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          # pillow: 블로그 썸네일 리사이즈/압축용 (sync_blog.py)
          pip install pillow

      - name: Run Blog Post Sync Script
        run: |
          python scripts/sync_blog.py

      - name: Check for updates
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New blog posts detected! Proceeding with commit and deployment."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new blog posts. Skipping build and deploy."
          fi

      # 순서: 커밋 → 최신 master 위로 rebase → 빌드 검사 → (통과 시에만) push → 배포
      # 예전에는 push 를 먼저 해서, 자동 생성 데이터로 빌드가 깨지면 master 가 깨진 채 남았다.
      - name: Commit changes (local only)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/images/portfolio/ src/data/mockData.ts
          git commit -m "chore(auto-sync): update portfolio with new blog posts [skip ci]"
          # 사람이 그 사이 push 한 커밋이 있어도 그 위에서 빌드·push 하도록 rebase
          git pull --rebase origin master

      - name: Setup Node.js
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Build project
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build
        env:
          VITE_GOOGLE_SHEET_WEBHOOK_URL: ${{ vars.VITE_GOOGLE_SHEET_WEBHOOK_URL }}
          # ⚠️ deploy.yml 과 같은 변수 목록을 유지해야 블로그 동기화 배포 때 측정 코드가 빠지지 않습니다.
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_ANALYTICS_COLLECT_URL: ${{ vars.VITE_ANALYTICS_COLLECT_URL }}

      # 빌드가 실패하면 여기까지 오지 않으므로 깨진 데이터가 master 에 올라가지 않는다.
      - name: Push to master
        if: steps.check_changes.outputs.has_changes == 'true'
        run: git push origin master

      - name: Deploy to GitHub Pages (gh-pages)
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: openthe.kr
